# ASCLE · Chốt tại CP2 và giữ nguyên cho hai lượt đánh giá.
metrics:
  - name: "ngan_sach_va_nguon"
    definition: "Với mọi câu trả lịch, tổng VNĐ/người bằng chỗ ở cộng thuê xe cộng vé, tổng không vượt ngân sách, và số còn lại bằng ngân sách trừ tổng. Mỗi giá và địa điểm trong lịch khớp mã dòng, vùng và đơn vị trong CSV; dùng giá tối đa cho mỗi đơn vị."
    grader: "nguoi"
    threshold: "100% câu có lịch"
    why: "Người lên lịch phải tính lại tiền khi hoạt động thay đổi."
  - name: "xu_ly_ngay_mua"
    definition: "Với các câu có đủ đầu vào và một ngày mưa hợp lệ, ngày đó có hoạt động trong nhà đúng vùng, không trùng lịch và đủ ngân sách, hoặc giữ trống có lý do khi thiếu căn cứ hay thời tiết nguy hiểm. Nếu chi phí vẫn vượt trần sau khi để trống, báo thiếu ngân sách và không xuất lịch. Không trình bày kịch bản như dự báo thật."
    grader: "nguoi"
    threshold: "100% câu có ngày mưa hợp lệ"
    why: "Người dùng cần căn cứ để đổi hoạt động khi mưa."
  - name: "dung_hanh_vi_theo_cau"
    definition: "Đối chiếu pass_criterion trong từng dòng benchmark. Chấm 1 khi đủ mọi điều kiện của dòng, gồm hỏi lại khi thiếu thông tin và nêu giới hạn đúng khi yêu cầu vượt thẩm quyền."
    grader: "nguoi"
    threshold: "Ít nhất 80% toàn bộ câu; 100% câu tu_choi"
    why: "Đo tỷ lệ yêu cầu nhận được lịch dùng được hoặc chỉ dẫn tiếp theo phù hợp."
