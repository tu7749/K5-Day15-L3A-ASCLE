name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run.py check
      - run: python -m pytest -q tests
      - name: Build Docker image
        run: docker build -t viet-du:ci .

  deploy:
    needs: test
    # Chỉ deploy khi push lên main và đã khai báo biến EC2_HOST (Settings → Secrets and variables → Actions → Variables).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.EC2_HOST }}
      SSH_USER: ${{ vars.EC2_USER || 'ubuntu' }}
      APP_DIR: ${{ vars.EC2_APP_DIR || 'K5-Day15-L3A-ASCLE' }}
      DOMAIN_VAR: ${{ vars.DOMAIN }}
    steps:
      - name: Chọn tên miền HTTPS
        run: |
          # Chưa có biến DOMAIN thì dùng <ip-gạch-ngang>.sslip.io, tên này tự trỏ về IP của EC2.
          DOMAIN="${DOMAIN_VAR:-${HOST//./-}.sslip.io}"
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "Tên miền: $DOMAIN"

      - name: Cấu hình SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy lên EC2
        run: |
          ssh -i ~/.ssh/id_ec2 "$SSH_USER@$HOST" APP_DIR="$APP_DIR" SHA="$GITHUB_SHA" DOMAIN="$DOMAIN" 'bash -s' <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch --quiet origin main
          git reset --hard "$SHA"
          touch .env
          grep -v '^DOMAIN=' .env > .env.tmp || true
          echo "DOMAIN=$DOMAIN" >> .env.tmp && mv .env.tmp .env
          docker compose up -d --build --remove-orphans
          # Container caddy không bị tạo lại khi chỉ Caddyfile đổi: nạp lại cấu hình, không gián đoạn.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          docker image prune -f >/dev/null
          docker compose ps
          EOF

      - name: Kiểm tra health
        run: |
          # Lần đầu Caddy cần vài chục giây để xin cert. curl kiểm cert thật, không dùng -k.
          for i in $(seq 1 36); do
            if curl -fsS "https://$DOMAIN/_stcore/health"; then echo; echo "https://$DOMAIN"; exit 0; fi
            sleep 5
          done
          echo "https://$DOMAIN chưa trả /_stcore/health sau 180 giây" >&2
          exit 1
